version: '3.8'

services:
  glpi-mobile-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_GLPI_URL: ${VITE_GLPI_URL:-http://localhost/glpi}
        VITE_GLPI_APP_TOKEN: ${VITE_GLPI_APP_TOKEN:-}
        VITE_ENABLE_MOCK: ${VITE_ENABLE_MOCK:-false}
    container_name: glpi_mobile_app
    ports:
      - "8086:80"   # HTTP: redirige a HTTPS
      - "450:443"   # HTTPS
    volumes:
      # Certificados SSL del servidor (ver certs/README.md); solo lectura
      - ./certs:/etc/nginx/certs:ro
    env_file:
      - .env
    restart: unless-stopped
